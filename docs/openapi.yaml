openapi: 3.0.3
info:
  title: Go Boilerplate API
  version: 0.1.0
  description: Starter API. Extend this spec as you add routes; it is served at /openapi.yaml and rendered at /docs (non-release modes only).
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
paths:
  /ping:
    get:
      tags: [system]
      summary: Reachability check
      responses:
        "200":
          description: Pong
  /health:
    get:
      tags: [system]
      summary: Overall health including database connectivity
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /livez:
    get:
      tags: [system]
      summary: Liveness probe
      responses:
        "200": { description: Alive }
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /api/v1/me:
    get:
      tags: [auth]
      summary: Claims of the authenticated caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Response" }
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Response" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Response:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
        error:
          type: object
          properties:
            code: { type: string, example: UNAUTHORIZED }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
            has_next: { type: boolean }
            has_prev: { type: boolean }
            next_cursor: { type: string }
        request_id: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        timestamp: { type: string, format: date-time }
        version: { type: string }
        uptime: { type: string }
        database: { type: string, enum: [up, down, disabled] }
        error: { type: string }
